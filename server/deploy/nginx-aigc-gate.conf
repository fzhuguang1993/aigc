# /etc/nginx/conf.d/aigc-gate.conf
# 前置 HTTPS：令牌走明文必被抓包重放，商用部署强制 443（阶段二安全红线）。
# 证书按自己域名换；80 只做跳转。
server {
    listen 80;
    server_name gate.example.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name gate.example.com;

    ssl_certificate     /etc/letsencrypt/live/gate.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/gate.example.com/privkey.pem;

    # 参考图上传走网关暂存，50MB 上限与服务端 MAX_UPLOAD_MB 对齐
    client_max_body_size 56m;

    # 产物中转是大文件流式下载：关缓冲、拉超时
    location /api/v1/file {
        proxy_pass http://127.0.0.1:8388;
        proxy_buffering off;
        proxy_read_timeout 900s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;   # 服务端限流按真实 IP
    }

    location / {
        proxy_pass http://127.0.0.1:8388;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_read_timeout 120s;
    }

    # 管理端默认只放行运维出口 IP（另一道保险是 X-Admin-Token）
    location /admin/ {
        allow 203.0.113.10;   # ← 换成你的固定出口 IP
        deny all;
        proxy_pass http://127.0.0.1:8388;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $remote_addr;
    }
}
